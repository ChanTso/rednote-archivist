version: 2
# Python receives Dependabot security updates from repository settings.
# Routine Python version updates are reviewed manually to avoid noisy or
# platform-unsafe OCR upgrades.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
